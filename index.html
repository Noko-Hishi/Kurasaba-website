<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>くら鯖 - Modシリーズ一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-inner">
    <div class="logo">くら鯖<span>.net</span></div>
    <nav>
      <a href="#" class="active">Mod一覧</a>
    </nav>
  </div>
</header>

<!-- ===== VERSION SELECTOR BAR ===== -->
<div class="version-bar">
  <div class="version-bar-inner" id="version-bar-inner">
    <!-- JS で描画 -->
  </div>
</div>

<!-- ===== HERO ===== -->
<div class="hero">
  <h1 id="hero-title"></h1>
  <p  id="hero-desc"></p>
  <div class="hero-tags" id="hero-tags"></div>
  <a href="#" id="download-btn" class="download-btn">⬇ Modpackをダウンロード</a>
</div>

<!-- ===== MAIN LAYOUT ===== -->
<div class="main">

  <!-- サイドバー -->
  <aside class="sidebar">
    <div class="sidebar-title">カテゴリ</div>
    <div class="sidebar-nav" id="sidebar-nav">
      <!-- JS で描画 -->
    </div>
  </aside>

  <!-- コンテンツ -->
  <main class="content" id="content-area">
    <!-- JS で描画 -->
  </main>

</div>

<!-- データ → ロジック の順で読み込む -->
<script src="mods.js"></script>
<script src="app.js"></script>

</body>
</html>
